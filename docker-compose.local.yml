services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zokul
      POSTGRES_PASSWORD: zokul
      POSTGRES_DB: zokul
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zokul']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: '3001'
      NODE_ENV: production
      DATABASE_URL: postgresql://zokul:zokul@postgres:5432/zokul
      JWT_SECRET: ${JWT_SECRET:?create .env first, see README}
      CORS_ORIGIN: http://localhost
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?create .env first, see README}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?create .env first, see README}
    ports:
      - '3001:3001'
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '80:80'
    volumes:
      - ./client/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

  # Daily backup of the database and uploaded files into ./backups (newest 14 kept).
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: zokul
    volumes:
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups
      - uploads:/uploads:ro
    entrypoint: ['sh', '/backup-loop.sh']
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
